  title: 早朝の色
  title_en: Colors of Early Dawn
  author: 奏
  image_public: true
  active: true
  instagram:
  camera: Canon EOS Kiss X8i
  lens:
  description: 朝4時に起きて、高尾山に登りました。山登りが好きな親友は、運動不足の私のために何度も休憩を取ってくれました。水筒のあったかいお茶が美味しかったです。やっと着いた頂上には、朝の光に照らされた秋の色が目覚めていました。
  description_en: I woke at 4 a.m. to climb Mount Takao. My best friend, an avid hiker, stopped for frequent breaks to accommodate my out-of-shape pace. The warm tea from our thermos tasted wonderful. When we finally reached the summit, the autumn colors were awakening, illuminated by the morning light.
  images:
