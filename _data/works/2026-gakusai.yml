  instagram:
  camera: Canon EOS Kiss X8i
  lens:
  description: 夏休み、電電の友達と、井の頭公園で花火をしようと夕暮れを待っていました。座っていたベンチの下、小さな秋の入り口を見つけました。
  description_en: During summer break, I met up with my electrical engineering friends at Inokashira Park, waiting for dusk so we could light sparklers together. Under the bench where I sat, I caught a small glimpse of autumn's quiet entrance.
