  description: |
    社会の歯車を目指して就活を頑張る毎日です。
    人間止まっていることは許されないもので、同じことを繰り返す彼らを羨ましく思ってしまいます。
  description_en: |
    Day after day, I push through the job hunt, striving to become just another cog in society.
    Human existence demands constant motion, and so I find myself envying hose who repeat the exact same routines without end.
